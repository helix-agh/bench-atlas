[project]
name = "bench-atlas"
version = "0.1.0"
description = "Tools for analysing and comparing continuous black-box optimization benchmarks: ELA, LON, diversity, cost and algorithm discrimination."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HELIX AGH"}]
license = {text = "MIT"}
urls = {Repository = "https://github.com/helix-agh/bench-atlas", Issues = "https://github.com/helix-agh/bench-atlas/issues"}
keywords = [
    "optimization",
    "benchmarking",
    "black-box-optimization",
    "continuous-optimization",
    "fitness-landscape-analysis",
    "exploratory-landscape-analysis",
    "local-optima-networks",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ioh>=0.3.22",
    "orivex>=0.1.0",
    "lonkit>=0.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "umap-learn>=0.5.5",
    "matplotlib>=3.7.0",
    "joblib>=1.4.0",
    "typer>=0.12.0",
]

[project.scripts]
bench-atlas = "bench_atlas.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_atlas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults (typer idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["bench_atlas"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
