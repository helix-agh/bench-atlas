[project]
site_name = "bench-atlas"
site_description = "Analyse and compare continuous black-box optimization benchmarks: ELA, LON, cost and algorithm discrimination."
site_author = "HELIX AGH"
site_url = "https://helix-agh.github.io/bench-atlas/"
repo_name = "helix-agh/bench-atlas"
repo_url = "https://github.com/helix-agh/bench-atlas"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 HELIX AGH, AGH University of Kraków"
extra_css = [
  "stylesheets/extra.css",
  "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js",
  "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js",
  "javascripts/katex.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Problems" = "problems.md" },
  { "Benchmarks" = [
    "benchmarks/index.md",
    { "BBOB and MA-BBOB" = "benchmarks/bbob.md" },
    { "CEC 2022" = "benchmarks/cec2022.md" },
    { "GNBG-I, II, III" = "benchmarks/gnbg.md" },
    { "Zigzag" = "benchmarks/zigzag.md" },
    { "IOHClustering" = "benchmarks/iohclustering.md" },
  ] },
  { "Analyses" = "analyses.md" },
  { "API reference" = [
    { "Problems" = "reference/problems.md" },
    { "Suites" = "reference/suites.md" },
    { "Analyses" = "reference/analyses.md" },
  ] },
  { "References" = "references.md" },
]

[project.theme]
language = "en"
logo = "assets/bench-atlas-mark-light.svg"
favicon = "assets/bench-atlas-mark-light.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_root_full_path = false
show_source = false
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
heading_level = 2

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
